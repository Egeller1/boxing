<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidney's Boxing Hero</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Sidney's Boxing Hero</h1>

      <!-- Refresh button -->
      <div class="refresh-button" onclick="window.location.reload(true);">
        ↻
      </div>

      <!-- Setup Panel -->
      <div id="setup-panel">
        <div class="form-group">
          <label for="round-length">Round Length:</label>
          <div class="time-input">
            <input
              type="number"
              id="round-minutes"
              min="0"
              max="59"
              value="3"
            />
            <span>:</span>
            <input
              type="number"
              id="round-seconds"
              min="0"
              max="59"
              value="0"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="break-length">Break Length:</label>
          <div class="time-input">
            <input
              type="number"
              id="break-minutes"
              min="0"
              max="59"
              value="1"
            />
            <span>:</span>
            <input
              type="number"
              id="break-seconds"
              min="0"
              max="59"
              value="0"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="rounds">Number of Rounds:</label>
          <input type="number" id="rounds" min="1" max="20" value="3" />
        </div>

        <div class="form-group">
          <label for="interval">Move Interval (seconds):</label>
          <div class="slider-container">
            <input
              type="range"
              id="interval"
              min="0.1"
              max="8"
              step="0.1"
              value="3"
            />
            <span id="interval-value">3.0s</span>
          </div>
        </div>

        <div class="form-group">
          <label for="voice-speed">Voice Speed:</label>
          <div class="slider-container">
            <input
              type="range"
              id="voice-speed"
              min="0.8"
              max="2.0"
              step="0.1"
              value="1.2"
            />
            <span id="voice-speed-value">1.2x</span>
          </div>
        </div>

        <div class="form-group">
          <label for="add-move">Add Custom Move:</label>
          <div class="add-move-container">
            <input type="text" id="add-move" placeholder="Enter move name" />
            <button id="add-move-btn">Add</button>
          </div>
        </div>

        <div class="move-list-container">
          <h3>Available Moves:</h3>
          <ul id="move-list"></ul>
        </div>

        <button id="start-btn" class="start-btn">START</button>
      </div>

      <!-- Timer Screen (Hidden initially) -->
      <div id="timer-screen" class="hidden" style="display: none">
        <div class="round-info">
          Round <span id="current-round">1</span> of
          <span id="total-rounds">3</span>
        </div>
        <div id="timer" class="timer">00:00</div>
        <div id="current-move" class="current-move"></div>
        <div class="controls-container">
          <button id="pause-btn" class="control-btn">PAUSE</button>
          <button id="reset-btn" class="control-btn">RESET</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
